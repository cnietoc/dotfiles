- clean: ['~']

- defaults:
    link:
      create: true
      force: true

- create:
    - $DOTFILES_PATH/shell/bash/completions
    - $DOTFILES_PATH/shell/bash/themes

- link:
    ~/.bash_profile: shell/bash/.bash_profile
    ~/.bashrc: shell/bash/.bashrc
    ~/.profile: shell/bash/.profile
    ~/.zimrc: shell/zsh/.zimrc
    ~/.zlogin: shell/zsh/.zlogin
    ~/.zshenv: shell/zsh/.zshenv
    ~/.zshrc: shell/zsh/.zshrc
    ~/.zprofile: shell/zsh/.zprofile
    ~/.inputrc: shell/.inputrc
    ~/.gitconfig: git/.gitconfig
    ~/.gitignore_global: git/.gitignore_global
    ~/.config/mise: langs/mise
    ~/.config/fastfetch: shell/fastfetch
    ~/.config/starship.toml: shell/starship/starship.toml
    ~/.config/nvim: editors/nvim
    ~/.config/bat/config: shell/bat/config
    ~/.config/btop: shell/btop
    ~/.config/thefuck: shell/thefuck
    ~/.config/atuin/config.toml: shell/atuin/config.toml
    ~/.config/gh/config.yml: git/gh/config.yml
    ~/.config/topgrade.d: os/mac/topgrade/topgrade.d
